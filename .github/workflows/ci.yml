name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned: GitHub moves ubuntu-latest to Ubuntu 26.04 between 19 October and 19 November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: tests/agentic/test_cited_commits.py checks every commit the docs cite

      # An exact tag: this action publishes no moving major tag such as v10.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - name: Install the locked packages
        run: uv sync --locked

      - name: Every gate (lint, format, types, layers, requirement ids, skip markers, every test)
        run: uv run python scripts/check.py --all

      # Three calls: the app is up, it reads the seeded database as a signed-in reviewer, and it serves the page.
      - name: The app starts with one command (N6)
        id: start
        run: |
          docker compose up --build --detach
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/health
          curl --fail --silent --show-error --output /dev/null -H "X-User-Id: rv.dana" http://localhost:8000/api/v1/pricing-exception-requests
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/ui/

      - name: Show the container logs when the app did not start
        if: failure() && steps.start.outcome == 'failure'
        run: docker compose logs

      - name: Stop the app and delete its data
        if: always()
        run: docker compose down --volumes
